# Ablation of E7: random removal on the same unit set and budget (lower bound).
_base_: ../E7.yaml

experiment:
  id: A3
  name: ablation_random
  description: Random unit removal at the same budget and unit set as E7.
  kind: ablation
  variant_of: E7
  budgets: [B2]
  outputs:
    - results/A3/B2/seed{0,1,2}/metrics.csv

pruning:
  criterion: random
  removal:
    # A random score has no per-weight meaning: divided by the unit size it would put the whole
    # layers (about 100 times larger than a channel group) first, so A3 would remove random
    # layers instead of random units. Without the division every unit is equally likely to go
    # next. Proposed 2026-10-12 (iteration 42); [team] confirm in the pre-registration.
    score_normalisation: none
