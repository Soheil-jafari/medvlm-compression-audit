# Ablation of E7: Delta = correct-answer log-prob drop vs prediction change (KL).
_base_: ../E7.yaml

experiment:
  id: A5
  name: ablation_delta_definition
  description: Delta as correct-answer log-probability drop vs prediction change (KL).
  kind: ablation
  variant_of: E7
  budgets: [B2]
  seeds: [0]                              # seed 0 only: exploratory (seed plan, 2026-11-08)
  variants: [logprob_drop, kl]
  outputs:
    - results/A5/<variant>/B2/seed0/metrics.csv

pruning:
  units:
    # D07 / pre-registration section 7 (A5): the KL effect is scored exactly, so with the
    # first-order estimate for the channel groups (D07 section 1) BOTH A5 variants run on the
    # exactly scored unit types only: layers and KV groups (exact removal); reported as such.
    # 2026-11-13 (Soheil and Amir, clarification in section 10): logprob_drop is its own B2
    # run, not E7 (E7 also removes first-order channel groups); it takes E7's exact scores of
    # these units (stage.subset_source), so it needs no scoring of its own
    types_by_variant:
      logprob_drop: [decoder_layer, attention_head]
      kl: [decoder_layer, attention_head]
  clinical:
    delta_by_variant:
      logprob_drop: logprob_drop
      kl: kl
