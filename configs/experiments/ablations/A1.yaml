# Ablation of E7: unweighted criterion (w_c = 1). Everything else as in E7.
_base_: ../E7.yaml

experiment:
  id: A1
  name: ablation_unweighted
  description: Clinical criterion with uniform finding weights (w_c = 1).
  kind: ablation
  variant_of: E7
  budgets: [B2]                           # confirmed 2026-11-08 (freeze list item 19): B2 only
  seeds: [0, 1, 2]                        # 3 seeds at B2: secondary comparison E7 vs A1 (2026-11-08)
  outputs:
    - results/A1/B2/seed{0,1,2}/metrics.csv

pruning:
  clinical:
    weighting: uniform
