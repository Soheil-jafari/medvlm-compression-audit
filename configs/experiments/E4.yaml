_base_: [../base.yaml, ../training.yaml, ../quantization.yaml]

experiment:
  id: E4
  name: qakd
  description: >-
    Student trained with quantization-aware distillation (GRACE-style, Chen et al.,
    arXiv:2601.22709) from cached E0 outputs.
  kind: main
  parent: null
  variant_of: null
  requires: [E0]
  budgets: []
  seeds: [0, 1, 2]
  variants: []
  scripts:
    - scripts/02_train_student.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E4/nobudget/seed{0,1,2}/metrics.csv
    - checkpoints/E4/ (never committed)
  status: planned

training:
  mode: qakd
  gradient_checkpointing: true            # memory only: the 4-bit forward is recomputed in the
                                          # backward pass layer by layer (same maths as E2)

quantization:                             # D08 option B (answered 2026-10-12)
  recipe: w4                              # the E3 w4 grid (4 bit, groups of 128); E4 is exported in
                                          # the same format and runs the same kernel as E3 w4
  qat:
    quantizer: lsq                        # learned step size per group; starts at the scales of
                                          # plain rounding (grid.symmetric_scales)
    adapter: lora_through_quantizer       # forward uses quantize(W + B A): the export is exact
  distillation:
    loss: gated_dkd                       # GRACE's confidence-gated decoupled distillation on the
    alpha: 1.0                            # cached top-20 (grace_modules.py defaults: alpha 1,
    beta: 4.0                             # beta 4, temperature 2)
    temperature: 2.0
