_base_: [../base.yaml, ../training.yaml]

experiment:
  id: E4
  name: qakd
  description: >-
    Student trained with quantization-aware distillation (GRACE-style, Chen et al.,
    arXiv:2601.22709) from cached E0 outputs.
  kind: main
  parent: null
  variant_of: null
  requires: [E0]
  budgets: []
  seeds: [0, 1, 2]
  variants: []
  scripts:
    - scripts/02_train_student.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E4/nobudget/seed{0,1,2}/metrics.csv
    - checkpoints/E4/ (never committed)
  status: planned

training:
  mode: qakd

quantization:                             # D08 option B (answered 2026-10-12)
  weight_bits: 4
  group_size: 128
  quantizer: lsq                          # learned step size per group, symmetric, initialised at
                                          # max|w| / 7 (plain rounding at the start)
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # decoder layers only
  export: gptq                            # packed in the GPTQ format, run with the E3 w4 kernel
  distillation:
    loss: gated_dkd                       # GRACE's confidence-gated decoupled distillation, on the
    alpha: 1.0                            # cached top-20 (grace_modules.py defaults: alpha 1,
    beta: 4.0                             # beta 4, temperature 2)
    temperature: 2.0
