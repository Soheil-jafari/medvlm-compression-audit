_base_: [../base.yaml, ../pruning.yaml, ../recovery.yaml]

experiment:
  id: E6
  name: output_similarity_layer_pruning
  description: >-
    E2 + output-similarity layer pruning (Khan et al. style, arXiv:2507.21976) +
    shared recovery, at every budget.
  kind: main
  parent: E2
  variant_of: null
  requires: [E0]
  budgets: [B1, B2, B3]
  seeds: [0, 1, 2]
  variants: []
  scripts:
    - scripts/04_score_pruning_units.py
    - scripts/05_prune_and_recover.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E6/nobudget/seed{0,1,2}/unit_scores.csv
    - results/E6/<budget>/seed{0,1,2}/metrics.csv
    - results/E6/<budget>/seed{0,1,2}/removal.json
  status: planned

pruning:
  criterion: output_similarity
  units:
    types: [decoder_layer]
  output_similarity:
    embedder:                             # sentence encoder of the method (all-MiniLM-L6-v2), run on the CPU
      source: sentence-transformers/all-MiniLM-L6-v2   # checked on the hub 2026-10-12 (Apache-2.0)
      revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41   # "main" on 2026-10-12; first load in RC-G2 confirms it
