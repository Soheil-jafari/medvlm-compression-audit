_base_: ../base.yaml

experiment:
  id: E3
  name: ptq
  description: >-
    E2 + post-training quantization: weight-only 8-bit and 4-bit (GPTQ/AWQ), and
    W8A8 where supported. Footprint is measured and placed relative to B1-B3.
  kind: main
  parent: E2
  variant_of: null
  requires: []
  budgets: []
  seeds: [0, 1, 2]                        # one PTQ run per E2 seed
  variants: [w8, w4, w8a8]
  scripts:
    - scripts/03_quantize.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E3/<variant>/nobudget/seed{0,1,2}/metrics.csv
    - results/E3/<variant>/nobudget/seed{0,1,2}/efficiency.csv
  status: planned

model:
  role: student
  start_from: E2

quantization:
  method: ptq
  calibration_size: TODO
  quantize_vision_encoder: TODO
  variants:
    w8:
      backend: TODO                       # gptq | awq
      weight_bits: 8
      activation_bits: null
      group_size: TODO
    w4:
      backend: TODO                       # gptq | awq
      weight_bits: 4
      activation_bits: null
      group_size: TODO
    w8a8:
      backend: TODO
      weight_bits: 8
      activation_bits: 8
      only_if_supported: true
