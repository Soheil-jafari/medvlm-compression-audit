_base_: [../base.yaml, ../quantization.yaml]

experiment:
  id: E3
  name: ptq
  description: >-
    E2 + post-training quantization: weight-only 8-bit and 4-bit with GPTQ, and 8-bit weights
    and activations with LLM.int8 (D08). Footprint is measured and placed relative to B1-B3.
  kind: main
  parent: E2
  variant_of: null
  requires: []
  budgets: []
  seeds: [0, 1, 2]                        # w8: 3 seeds for H2 (2026-11-08); w4, w8a8: seed 0 only
  variants: [w8, w4, w8a8]
  scripts:
    - scripts/03_quantize.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E3/<variant>/nobudget/seed{0,1,2}/metrics.csv (seeds 1, 2: w8 only)
    - results/E3/<variant>/nobudget/seed0/efficiency.csv
  status: planned

model:
  role: student
  start_from: E2

quantization:
  recipe: by_variant                      # the variant names the recipe in configs/quantization.yaml
