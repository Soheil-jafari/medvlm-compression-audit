_base_: ../base.yaml

experiment:
  id: E0
  name: teacher_full_precision
  description: >-
    Teacher, full precision. Reference model: checks that the teacher relies on the
    image, then caches its answers and top-k probabilities once for distillation
    and recovery.
  kind: main
  parent: null
  variant_of: null
  requires: []
  budgets: []
  seeds: [0]                              # no training; seed only drives stress-test sampling
  variants: []
  scripts:
    - scripts/00_check_teacher_image_reliance.py
    - scripts/01_cache_teacher_outputs.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E0/nobudget/seed0/metrics.csv
    - results/E0/nobudget/seed0/efficiency.csv
    - cache/teacher/ (answers + top-k probabilities; never committed)
  status: planned

model:
  role: teacher
  config: TODO                            # one of configs/models/*_teacher.yaml (CANDIDATE)
  start_from: pretrained
  precision: full

image_reliance_check:                     # tests, fill, mask_findings and caps are in base.yaml
  gate1:                                  # D04 decided 2026-10-12 (moderate rule)
    min_original_balanced_accuracy: 0.65
    min_blank_accuracy_drop: 0.10
    min_lesion_mask_effect_ci_low: 0.0    # the CI of the lesion-mask effect must lie above zero

teacher_cache:
  splits: [train]                         # S05: cache on the training split only
  pool_size: 10000                        # = training.data_subset (2026-10-16): cache exactly the training
                                          # pool E2, E4 and the recoveries use, not all 143k rows
  top_k: 20                               # D04 decided 2026-10-12
  max_new_tokens: d04_rule                # D04 rule: ceil(1.5 x p99 answer words) + 8, computed from the
                                          # committed results/data/summary.csv (46 from p99 = 25)
  shard_size: 1000
