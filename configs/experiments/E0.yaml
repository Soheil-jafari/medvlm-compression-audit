_base_: ../base.yaml

experiment:
  id: E0
  name: teacher_full_precision
  description: >-
    Teacher, full precision. Reference model: checks that the teacher relies on the
    image, then caches its answers and top-k probabilities once for distillation
    and recovery.
  kind: main
  parent: null
  variant_of: null
  requires: []
  budgets: []
  seeds: [0]                              # no training; seed only drives stress-test sampling
  variants: []
  scripts:
    - scripts/00_check_teacher_image_reliance.py
    - scripts/01_cache_teacher_outputs.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E0/nobudget/seed0/metrics.csv
    - results/E0/nobudget/seed0/efficiency.csv
    - cache/teacher/ (answers + top-k probabilities; never committed)
  status: planned

model:
  role: teacher
  config: TODO                            # one of configs/models/*_teacher.yaml (CANDIDATE)
  start_from: pretrained
  precision: full

image_reliance_check:
  tests: [blank_image, lesion_masked, random_region_masked, other_patient_image]
  fill: TODO                              # D04 proposes 128 (mid-grey) for the blank image and both mask conditions
  mask_findings: TODO                     # finding ids the lesion masks delineate (polyp for Kvasir-SEG); must be in the frozen finding list
  max_probes_per_finding: null            # null = all labelled images; cap only if time requires, same cap for every model
  max_mask_probes: null
  gate1:                                  # D04 proposals; approved by the team before RC-E0a
    min_original_balanced_accuracy: TODO  # proposal 0.65
    min_blank_accuracy_drop: TODO         # proposal 0.10
    min_lesion_mask_effect_ci_low: TODO   # proposal 0.0 (CI of the lesion-mask effect excludes zero)

teacher_cache:
  splits: [train]                         # S05: cache on the training split only
  top_k: TODO                             # D04 proposal, to be approved
  max_new_tokens: TODO                    # set from the RC-D1 answer-length counts (D04)
  shard_size: 1000
