_base_: [../base.yaml, ../training.yaml]

experiment:
  id: E10
  name: native_small_student
  description: >-
    Exploratory baseline (pre-freeze addition, Soheil and Amir, 2026-11-08): a natively small
    student, Qwen3-VL-2B (the D05 fallback), trained once with the E2 recipe, seed 0, and
    evaluated like every arm. If its tokenizer does not reproduce the teacher cache's token
    ids (RC-E10 step 1), it is trained with the E1 recipe (answers only) instead, and that is
    stated. Compared at matched peak memory with the pruned 3B arm nearest its footprint
    (after RC-B0), and at 4 bit against E8.
  kind: main
  parent: null
  variant_of: null
  requires: [E0]
  budgets: []
  seeds: [0]                              # seed 0 only: exploratory (seed plan, 2026-11-08)
  variants: []
  scripts:
    - scripts/02_train_student.py
    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E10/nobudget/seed0/metrics.csv
    - results/E10/nobudget/seed0/efficiency.csv
    - checkpoints/E10/ (never committed)
  status: planned

model:
  config: models/qwen3_vl_2b_student.yaml   # the D05 fallback; revision pinned 2026-11-12 (RC-E10 step 1)

training:
  mode: offline_kd                        # 2026-11-12: RC-E10 step 1 passed (0 of 5,238 cache ids
                                          # differ; 9,991 of 10,000 answers re-encoded exactly,
                                          # 99.9 % >= 99 %), so the E2 recipe (pre-registration
                                          # section 11 item 13); results/smoke/RC-E10/tokenizer_check.csv
