    - scripts/06_evaluate.py
    - scripts/07_benchmark_efficiency.py
  outputs:
    - results/E8/<budget>/seed0/metrics.csv
    - results/E8/<budget>/seed0/efficiency.csv
  status: planned

model:
  start_from: E7

quantization:
  recipe: w4                              # D08: the E3 w4 recipe on each E7 checkpoint
