# Template inherited by every candidate model config. Do not guess hub IDs,
# paths or licence terms: leave TODO until verified. A candidate may carry a
# source and licence only together with verified_on (date) and verified_from (the
# primary page or API record they were read from); tests enforce this.
model:
  status: "CANDIDATE - NOT DECIDED"
  name: TODO
  role: TODO                              # teacher | student
  family: TODO
  size: TODO
  source: TODO                            # verified hub ID or local path
  revision: TODO                          # pinned commit / version once chosen
  adapter: null                           # optional LoRA adapter (verified ID or path)
  tokenizer_shared_with: TODO             # teacher <-> student must share a tokenizer
  dtype: TODO
  licence: TODO                           # verify terms before use
  verified_on: null                       # YYYY-MM-DD when source / licence were read
  verified_from: null                     # URL of the primary record they were read from
  model_card: docs/model_cards/TEMPLATE.md
  notes: ""
