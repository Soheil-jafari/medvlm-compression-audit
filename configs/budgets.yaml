# Matched compression budgets. All arms are compared at the same MEASURED budget.
# Decided 2026-11-08 (Soheil and Amir; docs/preregistration.md section 4): B1 / B2 / B3 remove
# 15 / 30 / 45 % of E2's decoder-layer bytes; the target is E2's measured peak minus that share
# (RC-B0 only measures the two numbers, which turns the fractions into GB).
budgets:
  reference_experiment: E2                # budgets are fractions of E2's measured footprint
  metric: peak_memory                     # D07 section 4 (Soheil, 2026-10-12): deterministic, unlike latency on shared GPUs
  tolerance: 0.03                         # D07: allowed relative deviation from the target
  measurement:
    description: >-
      Peak GPU memory during inference (weights + activations + KV cache) and/or
      per-sample latency, measured with the protocol below on the final timing GPU.
      Parameter counts are reported but never used to match budgets.
    hardware: "Kaggle Tesla T4"           # 2026-11-08: every budget search and RC-B0 on the T4;
                                          # the timing GPU of RC-T1 is separate (still open)
    batch_size: 1                         # D07: one image, the deployment case
    max_new_tokens: d04_rule              # = evaluation.max_new_tokens (pre-registration section 4)
    warmup_runs: 3                        # D07
    repeats: 5                            # D07: timed passes
    samples: 32                           # D07: validation images drawn with a fixed seed, the same for every arm
    # The image side is the global inputs.image_longest_side and the prompts are the real
    # questions of these samples, so neither is a separate setting here.
  levels:
    B1:
      decoder_bytes_removed: 0.15         # 2026-11-08
      target_fraction: null               # not used: the decoder-bytes rule sets the target
      description: "Mild compression: 15 % of the decoder-layer bytes removed"
    B2:
      decoder_bytes_removed: 0.30         # 2026-11-08; PRIMARY budget
      target_fraction: null
      description: "Moderate compression, primary endpoints: 30 % of the decoder-layer bytes"
    B3:
      decoder_bytes_removed: 0.45         # 2026-11-08
      target_fraction: null
      description: "Aggressive compression: 45 % of the decoder-layer bytes"
