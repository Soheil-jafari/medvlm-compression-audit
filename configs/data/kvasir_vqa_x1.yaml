_base_: _dataset_base.yaml

dataset:
  status: "DECIDED"                     # 2026-10-12 (D02): main QA, rare findings
  name: "Kvasir-VQA-x1"
  domain: endoscopy
  candidate_role: main_qa
  access: open
  source: https://huggingface.co/datasets/SimulaMet/Kvasir-VQA-x1
  licence: cc-by-nc-4.0
  verified_on: "2026-10-12"
  verified_from: https://huggingface.co/api/datasets/SimulaMet/Kvasir-VQA-x1
  revision: 61e41148c3214bc5140ad0ab4c28520a512e2a73  # pinned 2026-10-12 (D02)
  reference: TODO                         # arXiv 2506.09958; add to paper/references.bib
  official_splits: {train: 143594, test: 15955}   # QA rows, from the hub record
  local_dir: ${env:MEDCOMPRESS_DATA_ROOT,data}/kvasir_vqa_x1   # images/, train.jsonl, test.jsonl
  has_masks: false
  has_patient_ids: false                  # only img_id
  splits_used:                            # D02 amendment 2026-10-18 (replaces Q1 = A)
    train: 70 % of all 6,449 images of both official splits, by near-duplicate group
    val: 15 % of the images
    test: 15 % of the images
  split_ratios: {train: 0.70, val: 0.15, test: 0.15}   # fractions of images; groups of near-
                                          # duplicates (near_duplicates below, transitive) go
                                          # whole, stratified by finding answer and by
                                          # Kvasir-SEG mask; seed seeds.data_split (data/prepare.py)
  near_duplicates:                        # D02 amendment 2 (2026-10-18; final values 2026-10-19,
                                          # before any model result). EVERY pair within
                                          # candidate_bits, 0-4 bits included, is one group only
                                          # if its crop correlation is >= min_correlation; nothing
                                          # is joined on the dHash alone. --close-bits 4 only names
                                          # the 0-4 bit band that is reported (pairs left apart)
    candidate_bits: 12                    # 64-bit dHash distance of the candidate pairs
    crop_fraction: 0.60                   # the central 60 % of width and of height (20 % cut per
                                          # side: the text, the green box, the black border)
    crop_side: 32                         # grey-scale, area-averaged to 32 x 32 pixels
    crop_highpass_sigma: 4.0              # a Gaussian blur of 4 px (at 32) is subtracted
    crop_max_shift: 3                     # px at 32 (5.6 % of the image side), in each direction
    min_correlation: 0.65                 # the crop rule of amendment 2 (RC-D1 run 3, NOT
                                          # accepted); kept only to reproduce run 3's sheet pairs
    max_group_fraction: 0.10              # chaining guard: STOP if one group holds more images
                                          # (was 0.05; below 0.60 the largest group jumps > 30 %)
    # D02 amendment 3 (2026-10-19, before any model result): run 3 showed copies that both the
    # crop correlation and the dHash missed. The joining measure is now the cosine of embeddings,
    # with the rule chosen on human labels (RC-D1-embed, RC-D1-label), then RC-D1 run 4.
    rule: labelled                        # read from results/data/near_duplicate_labels.csv
                                          # (labels:chosen:*), written by RC-D1-label's scoring
    embedding:
      model: facebook/dinov2-small        # DINOv2-small; read from the hub by RC-D1-embed
                                          # (Kaggle T4, 2026-10-19, commit cb5de07)
      revision: ed25f3a31f01632728cabb09d1542f84ab7b0056  # the hub commit RC-D1-embed printed
      licence: apache-2.0                 # the hub record's licence, as RC-D1-embed printed it
      side: 224                           # each view resized to 224 x 224 (aspect not kept)
      centre_fraction: 0.60               # the centre view: the central 60 % of width and height
      batch_size: 32
    candidates:                           # pairs for the labels (the rule itself is applied to
      knn_k: 20                           # all pairs): the 20 nearest by cosine, per view;
      dhash_bits: 12                      # dHash within 12 bits;
      crop_k: 5                           # the 5 highest crop correlations; and run 3's sheet
    labelling:
      seed: 20261012                      # the sample of about 300 pairs (data/labelling.py)
      min_precision: 0.5                  # rule choice: highest sensitivity with precision >= 0.5
      topup:                              # D02 amendment 3, recorded 2026-10-19 before any label:
        band: 0.03                        # if fewer than min_in_band labelled pairs lie within
        min_in_band: 30                   # +-band of the chosen threshold (chosen view), draw
        pairs: 100                        # this many candidate pairs from the band, leaving out
        seed: 20261013                    # labelled pairs; the rule is chosen again once
    strict_margin: 0.05                   # strict test subset: the most similar training image is
                                          # below the rule's threshold minus 0.05 (cosine; and the
                                          # crop level minus 0.05 if the rule has one)
  official_split_note: "by question, not by image: 3,821 of the 4,058 official test images are training images (RC-D1 run 1); used only for the data card and the appendix item"
  label_mapping:                          # per-image finding labels from the source Kvasir-VQA questions
    status: TODO                          # values filled from the RC-D1 answer counts, then pre-registered
    rules:
      - name: abnormalities
        question_contains: "are there any abnormalities in the image"
        mode: multi_label
        values: {}                        # answer value -> finding id, e.g. "polyp": polyp
        none_values: ["none", "no"]
  notes: "D02 amendments of 2026-10-18/19: the official split is by question, so all images are re-split by image (splits_used); near-duplicate groups by the embedding rule chosen on human labels (near_duplicates, amendment 3)."
