_base_: _dataset_base.yaml

dataset:
  status: "DECIDED"                     # 2026-10-12 (D02): main QA, rare findings
  name: "Kvasir-VQA-x1"
  domain: endoscopy
  candidate_role: main_qa
  access: open
  source: https://huggingface.co/datasets/SimulaMet/Kvasir-VQA-x1
  licence: cc-by-nc-4.0
  verified_on: "2026-10-12"
  verified_from: https://huggingface.co/api/datasets/SimulaMet/Kvasir-VQA-x1
  revision: 61e41148c3214bc5140ad0ab4c28520a512e2a73  # pinned 2026-10-12 (D02)
  reference: TODO                         # arXiv 2506.09958; add to paper/references.bib
  official_splits: {train: 143594, test: 15955}   # QA rows, from the hub record
  local_dir: ${env:MEDCOMPRESS_DATA_ROOT,data}/kvasir_vqa_x1   # images/, train.jsonl, test.jsonl
  has_masks: false
  has_patient_ids: false                  # only img_id
  splits_used:                            # D02 amendment 2026-10-18 (replaces Q1 = A)
    train: 70 % of all 6,449 images of both official splits, by near-duplicate group
    val: 15 % of the images
    test: 15 % of the images
  split_ratios: {train: 0.70, val: 0.15, test: 0.15}   # fractions of images; groups of near-
                                          # duplicates (dHash <= 4 bits, transitive) go whole,
                                          # stratified by finding answer and by Kvasir-SEG mask;
                                          # seed seeds.data_split (data/prepare.py)
  official_split_note: "by question, not by image: 3,821 of the 4,058 official test images are training images (RC-D1 run 1); used only for the data card and the appendix item"
  label_mapping:                          # per-image finding labels from the source Kvasir-VQA questions
    status: TODO                          # values filled from the RC-D1 answer counts, then pre-registered
    rules:
      - name: abnormalities
        question_contains: "are there any abnormalities in the image"
        mode: multi_label
        values: {}                        # answer value -> finding id, e.g. "polyp": polyp
        none_values: ["none", "no"]
  notes: "Teacher LoRA was trained on the train file (D01), so validation comes from the official test split."
