# PRE-REGISTERED finding weights for the clinical pruning criterion (E7, E8, A2, A4-A6).
# Values decided by Soheil and Amir on 2026-11-08 (the choices delegated to the research lead;
# docs/preregistration.md section 3, decisions log). FROZEN on 2026-11-08 (section 9): every
# change from now on needs a dated amendment (docs/preregistration.md section 10) and an entry
# in docs/decisions_log.md.
# A1 (uniform weights) and A2 (rarity only) are the pre-registered check of this choice.
preregistration:
  document: docs/preregistration.md
  frozen_on: "2026-11-08"
  frozen_by: "Soheil and Amir (Amir's written approval received)"
  commit: 18f1b47658eb188975dbbf3caa4b76e2e4d611fb   # the approved commit; the freeze entry follows it
  domain: endoscopy                       # D02

weighting:
  formula: "w_c = min(1 / prevalence_c, cap) * tier_multiplier(importance_tier_c)"
  prevalence_source: "results/data/summary.csv (RC-D1 run 4b, split_sha256 54dfa70a...): answer_count:abnormalities:<finding>:train / images:train (4,513)"
  cap: 20                                 # 2026-11-08: keeps one very rare finding from dominating;
                                          # none of the three findings reaches it (all above 5 %)
  normalisation: none                     # 2026-11-08: the criterion only ranks units, so a common
                                          # factor changes nothing
  tiers:                                  # 2026-11-08: assigned by rule from the finding names only
    - tier: action
      multiplier: 2.0
      definition: "a treatment is performed during the same examination (e.g. resection)"
    - tier: follow_up
      multiplier: 1.5
      definition: "changes treatment or follow-up but is not treated during the examination"
    - tier: other
      multiplier: 1.0
      definition: "everything else"

# One row per finding in the frozen finding list C (docs/preregistration.md section 2).
# prevalence = training images with the value / 4,513 (6 decimals); final_weight = the formula.
findings:
  - finding: polyp                        # 810 / 4,513; removed during the colonoscopy: action
    prevalence: 0.179481
    importance_tier: action
    cap: 20
    final_weight: 11.143241               # min(5.571620, 20) x 2.0
  - finding: ulcerative_colitis           # 691 / 4,513; changes treatment, not treated in the exam
    prevalence: 0.153113
    importance_tier: follow_up
    cap: 20
    final_weight: 9.796686                # min(6.531124, 20) x 1.5
  - finding: oesophagitis                 # 546 / 4,513; changes treatment, not treated in the exam
    prevalence: 0.120984
    importance_tier: follow_up
    cap: 20
    final_weight: 12.398334               # min(8.265556, 20) x 1.5
