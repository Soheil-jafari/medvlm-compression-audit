# Shared recovery recipe: IDENTICAL for every pruning arm (E5, E6, E7, A1-A6).
# Do not override any key below in an experiment config. tests/test_configs.py
# checks that the merged recovery section is the same for all pruning arms.
# D06 (2026-10-12): the adapter, optimiser and loss of the E2 recipe; 25 % of its steps.
recovery:
  method: lora_plus_offline_kd
  teacher_cache_from: E0
  teacher_cache_manifest_sha256: "d6ba0cb9d166cb2ae9a5dd8af5a1bbd2eebba904df0ccd795aded0d65b4f15d8"   # RC-E0b
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [decoder_attention, decoder_mlp]
  steps: 157                              # 2026-11-08: 25 % of the E2 examples (2,500) / 16 per
                                          # update, rounded up as the training steps (D06)
  learning_rate: 1.0e-4
  batch_size: 1                           # D06 amendment 2026-10-17: 1 x 16, as every training run
  grad_accumulation: 16
  gradient_checkpointing: false
  kd_weight: 0.5
  kd_temperature: 2.0
  data_subset: 2500                       # 2026-11-08: the first 2,500 examples of the fixed pool
                                          # (seeds.data_split), inside the E2 pool. The identical
                                          # recovery of every pruning arm is the fairness rule.
  warmup_steps: 20
  lr_schedule: linear
  max_grad_norm: 1.0
