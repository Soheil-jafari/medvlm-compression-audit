# Shared post-training quantization settings for E3, E8 and E9 (D08, answered 2026-10-12).
# Every quantized arm runs in transformers, like every other arm, so the evaluation and the
# timing code are the same. Only the decoder's linear layers are quantized; the vision encoder,
# the projector, the embeddings and the output head stay at 16 bit (pruning touches the same
# part of the model).
quantization:
  method: ptq
  engine: transformers
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # decoder layers only
  calibration:
    split: train
    size: 128                             # D08: the same nested 128 images as the pruning criteria (D07)
  recipes:
    w4:
      backend: gptq                       # GPTQModel
      weight_bits: 4
      activation_bits: null
      group_size: 128
    w8:
      backend: gptq                       # GPTQModel
      weight_bits: 8
      activation_bits: null
      group_size: 128
    w8a8:
      backend: llm_int8                   # bitsandbytes LLM.int8(): 8-bit weights and activations,
      weight_bits: 8                      # 16-bit outlier features (reported as such)
      activation_bits: 8
      group_size: null
  recipe: TODO                            # E3: the variant (w4 / w8 / w8a8); E8, E9: w4
  kernel_class: gptqmodel.nn_modules.qlinear.torch.TorchLinear
                                          # RC-Q0 (2026-10-15): the fastest class at w4 among those that
                                          # passed both w4 and w8 on a T4 (w4 0.238 ms, w8 0.201 ms);
                                          # "reference" = no kernel (tests only, fails the check)
  library_versions:                       # RC-Q0 (2026-10-15), Kaggle 1 x T4, Python 3.13.15, CUDA 12.8
    gptqmodel: "7.6.0"                    # pinned in requirements/train.txt
    bitsandbytes: "0.50.2"                # pinned in requirements/train.txt
    torch: "2.11.0+cu128"                 # tested with (Kaggle's build, not replaced)
    torchvision: "0.26.0+cu128"           # tested with
    transformers: "5.19.0"                # pinned in requirements/train.txt
    peft: "0.21.2"                        # pinned in requirements/train.txt
    accelerate: "1.14.0"                  # tested with
    torchao: "0.18.0"                     # tested with (peft 0.21.2 needs >= 0.16.0)
