# Shared pruning settings for E5, E6, E7 and A1-A6. Experiments override only the
# criterion-specific keys.
model:
  role: student
  start_from: E2

pruning:
  criterion: TODO                         # set per experiment
  units:
    types: [decoder_layer, attention_head, mlp_channel_group]
    include_vision_blocks: false          # optional
    keep_projector: true                  # the projector is never pruned
    respect_gqa: true                     # heads removed in grouped-KV-consistent groups
    mlp_channel_group_size: 128           # D07 (2026-10-12)
  calibration:
    split: train
    size: 128                             # D07 (2026-10-12): E7 default; A4 sweeps 32/64/128/256
  removal:
    physical: true                        # weights are deleted, not masked
    stop_when: measured_budget_met
    schedule: one_shot                    # D07 (2026-10-12): remove all at once, then recover
    score_normalisation: per_parameter    # D07 (2026-10-12): rank by the score per weight
    protected_layers:                     # no unit of these decoder layers is removed (layer, KV group or
      first: 2                            # channel group), for every arm: D07 (2026-10-12); amendments
      last: 1                             # of 2026-11-16 / 2026-11-17
    allocation: global                    # global: one ranking over every unit (E7, E6, A1-A6);
                                          # uniform_mlp: the same number k of MLP channel groups from
                                          # every unprotected layer, lowest score first (E5, E5R, E7U;
                                          # amendment of 2026-11-17)

mask_audit:
  enabled: true
  fill: 128                               # D04 (2026-10-12): flat mid-grey, same for lesion and random region
  random_region_max_tries: 100
