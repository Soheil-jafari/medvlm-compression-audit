# Shared student-training defaults for E1, E2 and E4 (same hyper-parameters so the
# only difference between arms is the training signal).
model:
  role: student
  config: models/qwen2_5_vl_3b_student.yaml   # D05 amendment (2026-10-12); status stays CANDIDATE until the RC-S0 checks pass
  start_from: pretrained

training:
  mode: TODO                              # sft (E1) | offline_kd (E2) | qakd (E4)
  method: lora
  lora:                                   # D06 (2026-10-12): all decoder projections, vision encoder frozen
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [decoder_attention, decoder_mlp]
  steps: TODO                             # ceil(data_subset / 16), set at the selection freeze (D06)
  learning_rate: 1.0e-4
  batch_size: 4                           # micro-batch; 4 x 4 accumulation = 16 examples per update
  grad_accumulation: 4
  kd_weight: 0.5                          # E1 sets 0 (answers only)
  kd_temperature: 2.0
  data_subset: TODO                       # Round 3 size of the selection, set at the freeze (D06)
  warmup_steps: 20
  lr_schedule: linear
  max_grad_norm: 1.0
  teacher_cache_from: E0
