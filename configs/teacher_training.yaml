# Our own teacher adapter (D01 amendment, 2026-10-18): Qwen2.5-VL-7B-Instruct at its pinned
# revision + a LoRA adapter trained on OUR training split only (the published SimulaMet adapter
# was trained on the official train split, which holds almost every image), at image side 672,
# the same input as the students. Run cards RC-TT0 (feasibility, rule 3) and RC-TT1 (training).
teacher_training:
  model: models/qwen2_5_vl_7b_teacher.yaml   # the base and its revision; its adapter is ours
  published_adapter: models/qwen2_5_vl_7b_teacher_simulamet.yaml  # read for adapter_config.json only
  learning_rate: 2.0e-5                   # from the SimulaMet args.json (D01 amendment)
  lr_schedule: cosine                     # from the SimulaMet args.json
  warmup_fraction: 0.03                   # from the SimulaMet args.json: 3 % of the steps
  weight_decay: 0.1                       # from the SimulaMet args.json
  max_grad_norm: 1.0                      # D06 (the students' value)
  batch_size: 1                           # micro-batch 1 x 16 accumulation = 16 per update, as
  grad_accumulation: 16                   # the students (D06 amendment 2026-10-17)
  target_modules: [decoder_attention, decoder_mlp]   # the language model; vision tower frozen
  lora_default: {rank: 16, alpha: 32, dropout: 0.05}  # D06; replaced by the published
                                          # adapter_config.json when RC-TT0 can read it there
  checkpoint_minutes: 30                  # resume state about every 30 minutes (estimate from
                                          # RC-TT0's step time)
  rule:                                   # rule 3, pre-registered 2026-10-18 before any result
    budget_gpu_hours: 15
    example_step: 1000                    # N is a multiple of 1,000 training examples
    slower_factor: 2.0                    # QLoRA (nf4, 1 x T4) only if fp16 over 2 x T4 runs out
                                          # of memory or is more than 2x slower per example
    t4x2_counts_twice: true               # a T4 x2 hour counts as 2 GPU hours until the team has
                                          # checked Kaggle's rule (TODO: verify); the other
                                          # reading is printed next to it
  quality:                                # rule 3, quality part
    margin_over_e1_seed0: 0.02            # validation macro balanced accuracy >= E1 seed 0 + 0.02
    extension_fraction: 0.5               # if Gate 1 or the margin fails: once more, +50 % of N
