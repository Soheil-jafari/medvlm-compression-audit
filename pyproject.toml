[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcompress"
version = "0.0.1"
description = "What Compression Forgets: pruning vs. quantization vs. distillation in medical vision-language models (research scaffolding)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Amir" },
    { name = "Soheil Jafari" },
    { name = "Farzan" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Private :: Do Not Upload",
]
# Keep in sync with requirements/base.txt. Heavy training libraries live in the
# "train" extra and are never imported at module top level.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pillow>=9.1",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers",  # TODO: pin once teacher/student pair is decided
    "peft",
    "accelerate",
    "datasets",
]
dev = [
    "pytest>=7.4",
    "ruff==0.6.9",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["paper", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["medcompress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "heavy: needs torch and transformers (tiny random models on CPU); skipped when they are not installed",
]
